service: serverless-boilerplate

provider:
  name: aws
  runtime: nodejs12.x
  stage: ${opt:stage, 'prod'}
  region: us-east-1
  timeout: 10 #Default Lambda timeout 
  memorySize: 512 #Default Lambda Memory Size
  versionFunctions: false # No functions versioning 
  #role: arn:aws:iam::#{AWS::AccountId}:role/existing-role
  package:
    excludeDevDependencies: true
    exclude:
      - .git/**
      - .vscode/**
      - .test/**
  
  environment: #Global Environment variables
      ${file(./configs/${self:provider.stage}.yml)}

  iamRoleStatements: # Permissions for all of your functions can be set here

  - Effect: Allow
    Action: # Gives permission to DynamoDB tables in a specific region
      - dynamodb:DescribeTable
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:GetItem
      - dynamodb:PutItem
      - dynamodb:UpdateItem
      - dynamodb:DeleteItem
    Resource: "arn:aws:dynamodb:*:*:*"

  - Effect: Allow
    Action: # Gives permission to Lambda execution
      - lambda:InvokeFunction
      - lambda:InvokeAsync
    Resource: "*"

  - Effect: Allow
    Action: # Publish messages to the books queue / DLQ
      - sqs:SendMessage
    Resource:
      - Fn::GetAtt:
          - BooksQueueExample
          - Arn
      - Fn::GetAtt:
          - BooksQueueDLQ
          - Arn
  - Effect: Allow
    Action: # Event Source Mapping permissions on the books queue
      - sqs:ReceiveMessage
      - sqs:DeleteMessage
      - sqs:GetQueueAttributes
    Resource:
      Fn::GetAtt:
        - BooksQueueExample
        - Arn
  - Effect: Allow
    Action: # ESM needs to read queue metadata
      - sqs:GetQueueUrl
    Resource:
      Fn::GetAtt:
        - BooksQueueExample
        - Arn

custom:
  region: ${self:provider.region}
  stage: ${opt:stage, self:provider.stage}
  prefix: ${self:custom.stage}-${self:service}
  process: ${self:custom.prefix}-process
  config: ${self:custom.prefix}-config
  dynamo-books: ${self:custom.prefix}-BooksCatalog
  sns-logs: ${self:custom.prefix}-trigger-logs
  sqs-logs: ${self:custom.prefix}-messages-logs
  sqs-logs-dlq: ${self:custom.prefix}-messages-logs-dlq
  dynamo-books-idempotency: ${self:custom.prefix}-BooksEventIdempotency

  # Books consumer (SQS Event Source Mapping) tuning
  sqs-batch-size: ${env:SQS_BATCH_SIZE, '10'}
  sqs-max-batching-window: ${env:SQS_MAX_BATCHING_WINDOW, '5'}
  sqs-max-concurrency: ${env:SQS_MAX_CONCURRENCY, '10'}
  sqs-max-receive-count: ${env:SQS_MAX_RECEIVE_COUNT, '5'}
  sqs-visibility-timeout: ${env:SQS_VISIBILITY_TIMEOUT, '330'}
  worker-timeout: ${env:WORKER_TIMEOUT, '30'}

  serverless-offline:
    host: '0.0.0.0'

  splitStacks:
    perFunction: true
    perType: true

  serverless-offline-sqs-esmq:
    apiVersion: '2012-11-05'
    endpoint: http://sqs:9324
    region: sa-east-1
    accessKeyId: root
    secretAccessKey: root

  dynamodb:
    stages:
      - local
      - test
      - dev

    start:
      host: "dynamo"
      port: 8000
      inMemory: false
      migrate: true
      noStart: true


plugins:
  - serverless-pseudo-parameters
  - serverless-dynamodb-local
  - serverless-offline-sqs-esmq
  - serverless-offline

functions: ${file(serverless-dynamic.js)}

# Infrastrucure - Cloud Formation
resources:  # CloudFormation template syntax

  Resources:
    #DynamoDB Books Table
    BooksCatalog:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.dynamo-books}
        AttributeDefinitions:
          - AttributeName: hashkey
            AttributeType: S
        KeySchema:
          - AttributeName: hashkey
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 2
          WriteCapacityUnits: 1

    # SQS Dead Letter Queue for permanently failing / poison messages
    BooksQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.sqs-logs-dlq}
        MessageRetentionPeriod: 1209600

    # SQS Queue that feeds the books-consumer Lambda.
    # VisibilityTimeout MUST exceed the full Lambda timeout (incl. batching
    # window) with a safety margin so in-flight messages never become visible
    # again while still being processed. Default: 330s = 5m batching + 30s x 6.
    BooksQueueExample:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.sqs-logs}
        MessageRetentionPeriod: 1209600
        VisibilityTimeout: ${self:custom.sqs-visibility-timeout}
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - BooksQueueDLQ
              - Arn
          maxReceiveCount: ${self:custom.sqs-max-receive-count}

    # Ledger of consumed eventIds - enforces exactly-once processing via
    # conditional PutItem inside a DynamoDB transaction. TTL prunes old rows.
    BooksEventIdempotency:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.dynamo-books-idempotency}
        AttributeDefinitions:
          - AttributeName: eventId
            AttributeType: S
        KeySchema:
          - AttributeName: eventId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
